name: Weekly Autonomous Council Deep Surveillance

on:
  schedule:
    # Every Sunday at 2:00 PM EST (18:00 UTC)
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  weekly_surveillance:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry & Dependencies
        run: |
          pip install poetry
          poetry install --no-root

      - name: Run Deep Council Surveillance & Rebalance Scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "🔍 Running Sunday Autonomous Investment Council Deep Surveillance..."
          poetry run python -m stocks.weekly_surveillance
          echo "🎨 Re-rendering master dashboard with fresh weekly council audit..."
          poetry run python -c "from stocks.dashboard import render_all; render_all()"

      - name: Commit and Push Weekly Surveillance Report
        run: |
          git config --global user.name "Prateek Malhotra"
          git config --global user.email "prateekmalhotra@g.ucla.edu"
          git add data/surveillance.json data/portfolio.json public/
          if git diff --staged --quiet; then
            echo "No changes from weekly surveillance."
          else
            git commit -m "Sunday Deep Surveillance: Autonomous Investment Council Audit & Valuation Scan [skip ci]"
            git push origin main
          fi

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
