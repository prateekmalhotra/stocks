name: Real-Time Market Quotes & Portfolio Stream
on:
  schedule:
    # Every 15 minutes during US Market Hours (13:00 to 21:00 UTC / 9:00 AM to 5:00 PM EST, Mon-Fri)
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "live-market-stream"
  cancel-in-progress: true

jobs:
  stream_quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry & Dependencies
        run: |
          pip install poetry
          poetry install --no-root

      - name: Sync Live Quotes & Portfolios
        run: |
          echo "⚡ Fetching live market quotes and recalculating portfolio valuations..."
          poetry run python -c "from stocks.portfolio import sync_live_market_data; sync_live_market_data()"
          poetry run python -c "from stocks.dashboard import render_all; render_all()"

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "Prateek Malhotra"
          git config --global user.email "prateekmalhotra@g.ucla.edu"
          git add data/ public/
          if git diff --staged --quiet; then
            echo "No quote delta to commit."
          else
            git commit -m "Live market quote stream & portfolio tick [skip ci]"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -X theirs origin main && git push origin main; then
                pushed=1
                break
              fi
              sleep 4
            done
            if [ "$pushed" -ne 1 ]; then
              echo "ERROR: Failed to push live quote stream after 5 attempts."
              exit 1
            fi
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
