name: Saturday Deep Surveillance - Aggressive Alpha ($200k)

on:
  schedule:
    # Every Saturday at 2:00 PM EST (18:00 UTC)
    - cron: '0 18 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  NODE_TLS_REJECT_UNAUTHORIZED: "0"

jobs:
  weekly_surveillance_aggressive:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry & Dependencies
        run: |
          pip install poetry
          poetry install --no-root

      - name: Run Saturday Council Surveillance on Aggressive Alpha Compounder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "🚀 Running Saturday Deep Surveillance on Aggressive Alpha Compounder ($200k)..."
          poetry run python -m stocks.weekly_surveillance aggressive
          echo "🎨 Re-rendering master dashboard and research reports..."
          poetry run python -c "from stocks.dashboard import render_all; render_all()"

      - name: Commit and Push Aggressive Surveillance Report
        run: |
          git config --global user.name "Prateek Malhotra"
          git config --global user.email "prateekmalhotra@g.ucla.edu"
          git add data/ public/
          if git diff --staged --quiet; then
            echo "No changes from Saturday surveillance."
          else
            git commit -m "Saturday Deep Surveillance: Aggressive Alpha Council Audit [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main && git push origin main && break || sleep 3
            done
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
