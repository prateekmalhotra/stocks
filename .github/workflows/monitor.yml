name: 24/7 Equity Surveillance & Living Thesis Engine

on:
  schedule:
    # 10:30 AM EST (14:30 UTC) - Morning Market Hours (Price corridor checks)
    - cron: '30 14 * * 1-5'
    # 6:00 PM EST (22:00 UTC) - Post-Market Close (Earnings calls, transcripts & filings review)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'run'
        type: choice
        options:
          - run
          - add_stock
      ticker:
        description: 'Ticker symbol (if action is add_stock)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  NODE_TLS_REJECT_UNAUTHORIZED: "0"
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  surveillance_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry & Dependencies
        run: |
          pip install poetry
          poetry install --no-root

      - name: Run Surveillance Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ github.event.inputs.action }}" = "add_stock" ] && [ -n "${{ github.event.inputs.ticker }}" ]; then
            echo "Adding new stock: ${{ github.event.inputs.ticker }}"
            poetry run python -m stocks.main add "${{ github.event.inputs.ticker }}"
          else
            echo "Running complete surveillance pass..."
            poetry run python -m stocks.main run
          fi

      - name: Quality Gatekeeper Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          poetry run python -m stocks.quality_gatekeeper

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Prateek Malhotra"
          git config --global user.email "prateekmalhotra@g.ucla.edu"
          git add data/ public/
          if git diff --staged --quiet; then
            echo "No changes in data or public reports."
          else
            git commit -m "Auto-update: Living theses & surveillance hub [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main && git push origin main && break || sleep 3
            done
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
